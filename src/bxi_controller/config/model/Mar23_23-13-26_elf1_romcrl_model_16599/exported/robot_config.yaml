obs_config:
  sensors:
    base_ang_vel:
      shape:
      - 3
      obs_scale: 0.2
      frames: 1
    projected_gravity:
      shape:
      - 3
      obs_scale: 1.0
      frames: 1
    command_lin_vel:
      shape:
      - 2
      obs_scale: 1.0
      frames: 1
    command_ang_vel:
      shape:
      - 1
      obs_scale: 1.0
      frames: 1
    clock_phase:
      shape:
      - 2
      obs_scale: 1.0
      frames: 1
    dof_pos:
      shape:
      - 12
      obs_scale: 1.0
      frames: 1
    dof_vel:
      shape:
      - 12
      obs_scale: 0.05
      frames: 1
    actions:
      shape:
      - 12
      obs_scale: 1.0
      frames: 1
  encoder_long_obs:
    sources:
    - base_ang_vel
    - projected_gravity
    - command_lin_vel
    - command_ang_vel
    - clock_phase
    - dof_pos
    - dof_vel
    - actions
    history_len: 66
    flatten: false
  encoder_short_obs:
    sources:
    - base_ang_vel
    - projected_gravity
    - command_lin_vel
    - command_ang_vel
    - clock_phase
    - dof_pos
    - dof_vel
    - actions
    history_len: 5
    flatten: true
  prop_obs:
    sources:
    - base_ang_vel
    - projected_gravity
    - command_lin_vel
    - command_ang_vel
    - clock_phase
    - dof_pos
    - dof_vel
    - actions
    history_len: 2
    flatten: true
pd_rate: 500.0
infer_rate: 50.0
step_period: 0.35
stand_rate: 0.55
clip_actions: 100.0
clip_obs: 100.0
exp_avg_decay: 1.0
